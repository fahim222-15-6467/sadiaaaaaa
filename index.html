<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Sadia ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

    <div id="particles"></div>

    <main class="container">

       

        <section id="opening" class="screen active">

            <div class="intro-small">
                I have something special to say...
            </div>

            <div class="name-intro">
                <span>S</span>
                <span>a</span>
                <span>d</span>
                <span>i</span>
                <span>a</span>
            </div>

            <div class="name-line"></div>

            <p class="intro-text">
                This little surprise is just for you ❤️
            </p>

            <button id="startBtn">
                Open My Message
            </button>

        </section>




        <section id="photoSection" class="screen">

            <div class="floating-name">
                Sadia
            </div>

            <div class="photo-wrapper">

                <div class="glow"></div>

                <div class="photo-ring"></div>

                <img
                    src="her-photo.jpg"
                    alt="Sadia"
                    class="her-photo"
                >

            </div>


            <div class="message-box">

                <div class="mini-heart">
                    ♥
                </div>

                <p id="typingText"></p>

            </div>


            <button id="nextBtn" class="hidden">
                One More Thing ✨
            </button>

        </section>


        
        <section id="proposal" class="screen">

            <div class="final-name">
                Sadia
            </div>

            <div class="heart">
                ❤️
            </div>

            <h2>For You</h2>

            <p class="question">
                Sadia, will you<br>
                be someone special<br>
                in my life?
            </p>

            <div class="buttons">

                <button id="yesBtn">
                    Yes ❤️
                </button>

                <button id="maybeBtn">
                    Let me think...
                </button>

            </div>

            <p id="answer"></p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
